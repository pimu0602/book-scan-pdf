<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Book Scan PDF</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="app-shell">
      <header class="app-header">
        <div>
          <p class="app-kicker">book-scan-pdf</p>
          <h1>Book Scan PDF</h1>
          <p class="app-lead">紙の本や資料を撮影してPDFにできます。</p>
        </div>
        <div class="page-counter" aria-live="polite">
          <span id="totalPages">0</span>
          <span>ページ</span>
        </div>
      </header>

      <div id="notice" class="notice" role="status" aria-live="polite"></div>

      <input id="imageInput" class="visually-hidden" type="file" accept="image/*" multiple>

      <section id="homeView" class="view view-active" aria-labelledby="homeTitle">
        <div class="view-heading">
          <h2 id="homeTitle">追加</h2>
        </div>
        <div class="primary-actions">
          <button id="selectImagesHome" class="button button-secondary" type="button">画像を選択</button>
          <button id="startCamera" class="button button-primary" type="button" aria-describedby="cameraDeviceNotice">カメラで撮影</button>
        </div>
        <div class="home-status">
          <p>現在のページ数：<strong id="homePageCount">0</strong>ページ</p>
          <button id="openPagesFromHome" class="text-button" type="button">ページ一覧を開く</button>
        </div>
        <p id="cameraDeviceNotice" class="device-note" hidden>カメラ撮影はスマートフォンのみ対応です。PC・タブレットでは画像を選択してください。</p>
        <p id="secureWarning" class="warning" hidden>カメラ機能を使うにはHTTPS環境が必要な場合があります。</p>
      </section>

      <section id="cameraView" class="view" aria-labelledby="cameraTitle">
        <div class="view-heading">
          <h2 id="cameraTitle">連続撮影</h2>
        </div>
        <div class="camera-layout">
          <div class="camera-stage">
            <video id="cameraVideo" playsinline autoplay muted></video>
          </div>
          <aside class="camera-panel">
            <div class="shoot-count" aria-live="polite">
              <span>撮影済み</span>
              <strong id="cameraPageCount">0ページ</strong>
            </div>
            <div class="camera-actions">
              <button id="capturePage" class="button button-capture" type="button">撮影する</button>
              <button id="undoCapture" class="button button-secondary" type="button" disabled>直前の1枚を削除</button>
              <button id="finishCamera" class="button button-quiet" type="button">終了</button>
            </div>
            <div class="latest-shot">
              <p>最新画像</p>
              <img id="latestThumb" alt="最新画像のサムネイル">
            </div>
          </aside>
        </div>
        <div class="strip-wrap">
          <div id="cameraStrip" class="camera-strip" aria-label="簡易サムネイル一覧"></div>
        </div>
      </section>

      <section id="pagesView" class="view" aria-labelledby="pagesTitle">
        <div class="view-heading view-heading-row">
          <div>
            <h2 id="pagesTitle">ページ確認</h2>
            <p><span id="pagesCount">0</span>ページ</p>
          </div>
          <div class="heading-actions">
            <button id="addImagesPages" class="button button-secondary" type="button">画像を追加</button>
            <button id="backHome" class="button button-quiet" type="button">戻る</button>
          </div>
        </div>

        <div id="emptyState" class="empty-state">
          <p>PDFにする画像がありません。</p>
          <div class="empty-actions">
            <button id="selectImagesEmpty" class="button button-secondary" type="button">画像を選択</button>
            <button id="startCameraEmpty" class="button button-primary" type="button" aria-describedby="cameraDeviceNotice">カメラで撮影</button>
          </div>
        </div>

        <div id="pageGrid" class="page-grid"></div>

        <div class="pdf-panel">
          <fieldset class="pdf-layout-options">
            <legend>PDFレイアウト</legend>
            <label>
              <input type="radio" name="pdfLayout" value="standard" checked>
              <span>通常</span>
            </label>
            <label>
              <input type="radio" name="pdfLayout" value="document">
              <span>自動補正</span>
            </label>
          </fieldset>
          <label for="pdfName">PDFファイル名</label>
          <div class="pdf-controls">
            <input id="pdfName" type="text" value="book-scan" autocomplete="off">
            <button id="createPdf" class="button button-primary" type="button">PDFを作成</button>
            <button id="sharePdf" class="button button-secondary" type="button">PDFを共有</button>
          </div>
          <p id="pdfStatus" class="pdf-status" aria-live="polite"></p>
        </div>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
